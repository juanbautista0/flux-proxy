<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux-Proxy - Parent Example</title>
    <script src="../../dist/index.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        iframe { border: 1px solid #ccc; width: 100%; height: 300px; }
        button { margin: 10px 0; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>Flux-Proxy - Parent Context</h1>
    <button id="loadIframe">Load iframe</button>
    <div id="iframeContainer"></div>
    <div id="log"></div>

    <script>
        // Function to handle data requests from the child iframe
        const handleData = async (message) => {
            console.log('Request received from child:', message);
            
            // Simulate a response based on the requested collection
            if (message.collection === 'users') {
                return [
                    { id: 1, name: 'Anna' },
                    { id: 2, name: 'Charles' }
                ];
            }
            
            return { message: 'Data not found' };
        };

        // Load the iframe when the button is clicked
        document.getElementById('loadIframe').addEventListener('click', () => {
            const container = document.getElementById('iframeContainer');
            container.innerHTML = '<iframe src="child.html"></iframe>';
            
            // Listen for messages from the child iframe
            window.addEventListener('message', (event) => {
                // Use FluxProxy to process the message
                FluxProxy.parentClient.onMessage(
                    event.data,
                    window,
                    handleData
                );
                
                // Log the communication
                const log = document.getElementById('log');
                log.innerHTML += `<p>Message received: ${JSON.stringify(event.data)}</p>`;
            });
        });
    </script>
</body>
</html>
